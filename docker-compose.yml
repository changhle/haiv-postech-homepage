services:
  # 1. Reverse proxy — the single public entrypoint
  nginx:
    image: nginx:alpine
    ports:
      # Host port 8090 (80/443 are already taken on this server; change as needed)
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # 2. Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Server-side fetch target; internal Docker network hostname
      - API_URL=http://backend:8080/api
    depends_on:
      - backend
    restart: unless-stopped

  # 3. Backend (Express + Prisma API server)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://haiv:${POSTGRES_PASSWORD:-haiv_password}@db:5432/haiv_lab
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 4. Database (PostgreSQL) — internal only, not exposed to the host
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=haiv
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-haiv_password}
      - POSTGRES_DB=haiv_lab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haiv -d haiv_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
